name: Temporary Typography Formatting

on:
  push:
    branches:
      - feature/fabrique-typography-atelier

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pnpm install --frozen-lockfile
      - name: Apply repository formatter only to typography feature files
        run: |
          pnpm exec biome check --write --unsafe \
            apps/web/src/typography-system.ts \
            apps/web/src/typography-system.test.ts \
            apps/web/src/TypographyAtelier.tsx \
            apps/web/src/typography-atelier.test.ts \
            apps/web/src/FabriqueEnvironment.tsx
          git diff --check
      - name: Commit normalized styling to feature branch only
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/web/src/typography-system.ts apps/web/src/typography-system.test.ts apps/web/src/TypographyAtelier.tsx apps/web/src/typography-atelier.test.ts apps/web/src/FabriqueEnvironment.tsx
            git commit -m "style(fabrique): normalize typography source via Biome"
            git push origin HEAD:feature/fabrique-typography-atelier
          fi
