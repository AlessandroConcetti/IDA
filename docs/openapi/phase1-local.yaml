openapi: 3.1.0
info:
  title: IDA local Phase 1 API
  version: 0.1.0
  description: >-
    Contrat du runtime de développement local. Il expose uniquement des données
    de démonstration, des commandes IDA déterministes en lecture seule, une
    modification interne bornée de l’Artist Brain, une création Music Brain
    strictement contrôlée, un registre de briefs de campagne internes avec lien
    de release contrôlé, un flux
    de mémoire consentie local, un Approval Center interne sans livraison et
    un Task Center interne contrôlé.
servers:
  - url: http://127.0.0.1:8787
    description: API locale de développement
paths:
  /health:
    get:
      operationId: getHealth
      summary: Vérifie la disponibilité du runtime local
      responses:
        '200':
          description: Runtime disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/me:
    get:
      operationId: getDemoIdentity
      summary: Retourne l'identité locale de démonstration
      responses:
        '200':
          description: Identité et workspace fixés côté serveur
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/DemoIdentity'
  /v1/modules:
    get:
      operationId: listModules
      summary: Liste les modules déclarés du Command Center
      responses:
        '200':
          description: Modules de l'interface commune
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleListResponse'
  /v1/system/status:
    get:
      operationId: getSystemStatus
      summary: Retourne les états système observés
      responses:
        '200':
          description: États du runtime local et des intégrations absentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatusListResponse'
  /v1/activity-logs:
    get:
      operationId: listActivityLogs
      summary: Liste une projection sûre de l’activité locale
      description: >-
        Lecture seule de l’audit, limitée au workspace imposé par le serveur.
        La réponse ne contient que id, action, entityType, entityId et createdAt.
        Elle ne sélectionne ni payload, acteur, workspace, caption, hash, token,
        chemin ou média privé. Seules les actions Phase 1 explicitement
        autorisées sont visibles ; les futurs domaines sensibles restent masqués.
      parameters:
        - name: limit
          in: query
          required: false
          description: Nombre d’éléments par page ; 20 par défaut.
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 20
        - name: cursor
          in: query
          required: false
          description: Curseur de continuation Base64URL, à traiter comme opaque par le client.
          schema:
            type: string
            minLength: 1
            maxLength: 512
            pattern: '^[A-Za-z0-9_-]+$'
      responses:
        '200':
          description: Page d’activité sûre, triée par createdAt puis id décroissants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityLogListResponse'
        '400':
          $ref: '#/components/responses/InvalidActivityLogQuery'
  /v1/artist-profile:
    get:
      operationId: getArtistProfile
      summary: Retourne le profil artistique de démonstration
      responses:
        '200':
          description: Artist Brain de démonstration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistProfileResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateArtistProfile
      summary: Met à jour une partie de l’Artist Brain local
      description: >-
        Utilise le contexte workspace imposé par le serveur et l’outil interne
        update_artist_profile avec la permission WRITE. Aucun champ de scope,
        appel externe ou effet de publication n’est accepté.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtistProfileUpdateRequest'
      responses:
        '200':
          description: Artist Brain local mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistProfileResponse'
        '400':
          $ref: '#/components/responses/InvalidArtistProfile'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/releases:
    get:
      operationId: listReleases
      summary: Liste les releases de démonstration
      responses:
        '200':
          description: Releases du workspace local
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseListResponse'
  /v1/campaigns:
    get:
      operationId: listCampaignBriefs
      summary: Liste les briefs de campagne internes du workspace local
      description: >-
        Lecture isolée au workspace résolu côté serveur. Les briefs ne portent
        que leur lien optionnel de release; ils ne portent encore ni date, ni
        pilier, ni contenu ou effet externe.
      responses:
        '200':
          description: Briefs de campagne internes dans un ordre stable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignListResponse'
    post:
      operationId: createCampaignBrief
      summary: Crée un brief de campagne interne DRAFT
      description: >-
        Accepte uniquement name et objective. Le serveur impose workspace,
        projet, acteur, identifiant et état DRAFT puis passe par l'outil
        allowlisté create_campaign avec CAMPAIGNS/WRITE. Cette route ne crée
        aucun lien de release, contenu, calendrier, tâche, notification ou
        appel externe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignCreateRequest'
      responses:
        '201':
          description: Brief de campagne DRAFT créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResponse'
        '400':
          $ref: '#/components/responses/InvalidCampaign'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CampaignAlreadyExists'
  /v1/campaigns/{campaignId}/release:
    patch:
      operationId: linkCampaignBriefRelease
      summary: Rattache ou retire la release d’un Campaign Brief
      description: >-
        Reçoit une release existante ou null et une version attendue. Le serveur
        vérifie que la campagne et la release partagent le workspace et le projet
        artistique, applique une écriture conditionnelle versionnée et appelle
        uniquement link_campaign_release avec CAMPAIGNS/WRITE. Aucun contenu,
        date, planification, IA ou effet social n’est créé.
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignReleaseLinkRequest'
      responses:
        '200':
          description: Lien déjà présent ou campagne mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResponse'
        '400':
          $ref: '#/components/responses/InvalidCampaignReleaseLink'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CampaignOrReleaseNotFound'
        '409':
          $ref: '#/components/responses/CampaignStale'
  /v1/tracks:
    get:
      operationId: listTracks
      summary: Liste les tracks de démonstration
      responses:
        '200':
          description: Tracks du workspace local
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackListResponse'
    post:
      operationId: createTrack
      summary: Ajoute un morceau interne au Music Brain local
      description: >-
        Utilise le contexte workspace, le projet et l'acteur imposés par le
        serveur, puis l'outil interne allowlisté create_track avec la permission
        WRITE. Aucun champ de scope, upload, association média ou effet externe
        n'est accepté.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackCreateRequest'
      responses:
        '201':
          description: Morceau local créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackResponse'
        '400':
          $ref: '#/components/responses/InvalidTrack'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/media:
    get:
      operationId: listMedia
      summary: Recherche les métadonnées de médias du workspace local
      description: >-
        Lecture locale bornée et sans effet d'écriture. Les filtres se
        cumulent ; le workspace est résolu côté serveur et ne peut pas être
        fourni par le client. La réponse ne contient jamais de clé, chemin ou
        URL de stockage.
      parameters:
        - name: q
          in: query
          required: false
          description: Recherche littérale dans le nom, la description et les tags.
          schema:
            type: string
            minLength: 1
            maxLength: 160
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MediaStatus'
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MediaType'
        - name: tag
          in: query
          required: false
          description: Tag exact, normalisé côté serveur.
          schema:
            type: string
            minLength: 1
            maxLength: 80
        - name: limit
          in: query
          required: false
          description: 50 par défaut ; la pagination par curseur n'est pas encore livrée.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
      responses:
        '200':
          description: Médias filtrés dans le workspace local
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaListResponse'
        '400':
          $ref: '#/components/responses/InvalidMediaQuery'
    post:
      operationId: importMedia
      summary: Importe un média local privé dans la Content Library
      description: >-
        Accepte exactement un fichier et les champs texte optionnels description
        et tags (liste séparée par des virgules). Le workspace, le projet et
        l'acteur sont imposés par le serveur ; l'outil interne allowlisté
        import_media utilise CONTENT/WRITE. Aucun chemin, URL de stockage,
        scope client, publication ou appel externe n'est accepté.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MediaImportRequest'
      responses:
        '201':
          description: Média privé importé dans le workspace local
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAssetResponse'
        '400':
          $ref: '#/components/responses/InvalidMediaImport'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DuplicateMedia'
        '413':
          $ref: '#/components/responses/MediaFileTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaFile'
  /v1/memories:
    get:
      operationId: listMemories
      summary: Liste les mémoires du workspace local avec leurs timestamps persistés
      responses:
        '200':
          description: Mémoires structurées du workspace local
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryListResponse'
  /v1/memories/proposals:
    post:
      operationId: createMemoryProposal
      summary: Propose une préférence durable qui reste en attente de consentement
      description: >-
        Accepte uniquement le contenu d'une préférence. Le serveur impose le
        workspace, l'acteur, l'identifiant, PREFERENCE_MEMORY et PENDING ; la
        proposition ne devient jamais permanente avant une confirmation séparée.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryProposalRequest'
      responses:
        '201':
          description: Proposition PENDING créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryResponse'
        '400':
          $ref: '#/components/responses/InvalidMemoryProposal'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/memories/{memoryId}/confirm:
    post:
      operationId: confirmMemory
      summary: Confirme explicitement une proposition PENDING
      description: >-
        Ne reçoit aucun corps. La transition atomique PENDING vers CONFIRMED est
        immuable après succès et est limitée au workspace serveur.
      parameters:
        - $ref: '#/components/parameters/MemoryId'
      responses:
        '200':
          description: Mémoire confirmée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryResponse'
        '400':
          $ref: '#/components/responses/InvalidMemoryDecision'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/MemoryNotFound'
        '409':
          $ref: '#/components/responses/MemoryDecisionFinal'
  /v1/memories/{memoryId}/reject:
    post:
      operationId: rejectMemory
      summary: Refuse explicitement une proposition PENDING
      description: >-
        Ne reçoit aucun corps. La transition atomique PENDING vers REJECTED est
        immuable après succès et est limitée au workspace serveur.
      parameters:
        - $ref: '#/components/parameters/MemoryId'
      responses:
        '200':
          description: Mémoire refusée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryResponse'
        '400':
          $ref: '#/components/responses/InvalidMemoryDecision'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/MemoryNotFound'
        '409':
          $ref: '#/components/responses/MemoryDecisionFinal'
  /v1/approvals/queue:
    get:
      operationId: listApprovalQueue
      summary: Liste les propositions REQUESTED à valider
      description: >-
        Retourne uniquement les demandes d'approbation du workspace résolu côté
        serveur. La date éventuelle est une date proposée, pas une publication
        programmée. Le hash couvre également titre, objectif, rationale
        éventuelle, texte et médias ordonnés. Les médias n'exposent que id,
        filename, type et status.
      responses:
        '200':
          description: File d'approbations internes dans un ordre stable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalQueueResponse'
  /v1/calendar:
    get:
      operationId: getEditorialCalendar
      summary: Projette le calendrier éditorial interne
      description: >-
        Retourne les snapshots de planification interne encore valides et les
        variantes APPROVED prêtes à planifier. Les bornes from/to sont
        obligatoires ensemble, forment une plage [from, to) d'au plus 62 jours
        et sont dérivées dans le fuseau du workspace lorsqu'elles sont absentes.
        Aucun payload éditorial, média, compte ou secret n'est exposé.
      parameters:
        - name: view
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CalendarView'
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Projection bornée et triée du calendrier du workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarResponse'
        '400':
          $ref: '#/components/responses/InvalidCalendarQuery'
  /v1/post-variants/{variantId}/approve:
    post:
      operationId: approvePostVariant
      summary: Approuve humainement une version exacte de variante
      description: >-
        Vérifie approvalId et expectedPayloadHash dans le workspace serveur,
        construit ensuite la preuve humaine côté serveur et applique REQUESTED
        vers APPROVED. Ne programme ni ne publie aucun contenu.
      parameters:
        - $ref: '#/components/parameters/PostVariantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostVariantDecisionRequest'
      responses:
        '200':
          description: Décision APPROVED ou retry idempotent de la même décision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostVariantDecisionResponse'
        '400':
          $ref: '#/components/responses/InvalidApprovalDecision'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PostVariantNotFound'
        '409':
          description: Payload obsolète ou décision finale opposée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/post-variants/{variantId}/reject:
    post:
      operationId: rejectPostVariant
      summary: Refuse humainement une version exacte de variante
      description: >-
        Vérifie approvalId et expectedPayloadHash dans le workspace serveur,
        construit ensuite la preuve humaine côté serveur et applique REQUESTED
        vers REJECTED. Ne programme ni ne publie aucun contenu.
      parameters:
        - $ref: '#/components/parameters/PostVariantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostVariantDecisionRequest'
      responses:
        '200':
          description: Décision REJECTED ou retry idempotent de la même décision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostVariantDecisionResponse'
        '400':
          $ref: '#/components/responses/InvalidApprovalDecision'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PostVariantNotFound'
        '409':
          description: Payload obsolète ou décision finale opposée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/post-variants/{variantId}/internal-schedules:
    post:
      operationId: scheduleApprovedPostVariantInternally
      summary: Crée un snapshot de planification interne d'une variante approuvée
      description: >-
        Revalide l'approbation et le hash canonique dans le workspace serveur,
        puis copie exclusivement l'horaire et le fuseau approuvés. Cette route
        ne crée ni livraison, ni publication, ni appel réseau externe.
      parameters:
        - $ref: '#/components/parameters/PostVariantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalPostScheduleRequest'
      responses:
        '201':
          description: Snapshot interne créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalPostScheduleResponse'
        '200':
          description: Retry exact d'un snapshot actif existant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalPostScheduleResponse'
        '400':
          $ref: '#/components/responses/InvalidInternalPostSchedule'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PostVariantNotFound'
        '409':
          description: Approbation obsolète, date indisponible ou créneau en conflit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/tasks:
    get:
      operationId: listTasks
      summary: Liste les tâches du workspace local
      description: Les tâches sans échéance restent visibles ici, mais n'apparaissent pas dans la projection Today.
      responses:
        '200':
          description: Tâches structurées du workspace local
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
    post:
      operationId: createTask
      summary: Crée une tâche interne TODO
      description: >-
        Accepte uniquement title, description optionnelle et dueAt optionnel.
        Le serveur impose l'identifiant, le workspace, l'acteur et l'état TODO.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
      responses:
        '201':
          description: Tâche TODO créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/InvalidTask'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/tasks/{taskId}/complete:
    post:
      operationId: completeTask
      summary: Finalise une tâche active
      description: >-
        Ne reçoit aucun corps. Effectue TODO ou IN_PROGRESS vers DONE dans le
        workspace serveur. Un retry sur DONE est idempotent et ne produit pas de
        seconde écriture ni de second audit.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Tâche complétée ou résultat idempotent déjà DONE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/InvalidTaskCompletion'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '409':
          $ref: '#/components/responses/TaskNotActionable'
  /v1/social/platforms:
    get:
      operationId: listSocialPlatformCapabilities
      summary: Retourne les capacités sociales déclarées
      description: Ne connecte aucun compte et n'appelle aucune plateforme externe.
      responses:
        '200':
          description: Capacités de démonstration à revalider avant intégration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialPlatformListResponse'
  /v1/ida/commands:
    post:
      operationId: executeIdaCommand
      summary: Exécute une commande IDA déterministe et en lecture seule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdaCommandRequest'
      responses:
        '200':
          description: Commande comprise et exécutée avec des outils READ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdaCommandResponse'
        '400':
          $ref: '#/components/responses/InvalidCommand'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  parameters:
    MemoryId:
      name: memoryId
      in: path
      required: true
      description: Identifiant de mémoire résolu dans le workspace serveur.
      schema:
        type: string
        minLength: 1
    PostVariantId:
      name: variantId
      in: path
      required: true
      description: Identifiant de variante résolu dans le workspace serveur.
      schema:
        type: string
        minLength: 1
    TaskId:
      name: taskId
      in: path
      required: true
      description: Identifiant de tâche résolu dans le workspace serveur.
      schema:
        type: string
        minLength: 1
    CampaignId:
      name: campaignId
      in: path
      required: true
      description: Identifiant de campagne résolu dans le workspace serveur.
      schema:
        type: string
        minLength: 1
  responses:
    InvalidCommand:
      description: Corps de commande ou filtre invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidActivityLogQuery:
      description: Query d’activité inconnue, dupliquée ou pagination invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidArtistProfile:
      description: Corps Artist Brain invalide ou tentative de définir le scope client
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidTrack:
      description: Corps Music Brain invalide ou tentative de définir le scope client
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidCampaign:
      description: Corps Campaign Brief invalide ou tentative de définir le scope, le projet, l'acteur ou l'état client
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CampaignAlreadyExists:
      description: Un brief avec le même nom normalisé existe déjà dans ce workspace
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidCampaignReleaseLink:
      description: Corps de liaison release invalide ou tentative d’injecter un champ de campagne, scope ou acteur
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CampaignOrReleaseNotFound:
      description: Campagne ou release compatible introuvable dans le scope autorisé
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CampaignStale:
      description: La version de campagne attendue n’est plus courante
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidMediaImport:
      description: Formulaire media invalide, champ inattendu ou tentative de définir le scope client
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidMediaQuery:
      description: Filtre média invalide ou paramètre reconnu dupliqué
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidMemoryProposal:
      description: Proposition de mémoire invalide ou tentative de définir un état, un scope, un identifiant ou un acteur client
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidMemoryDecision:
      description: Décision de mémoire invalide ou corps non vide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MemoryNotFound:
      description: Mémoire introuvable dans le workspace autorisé
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MemoryDecisionFinal:
      description: La mémoire possède déjà un état final immuable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidApprovalDecision:
      description: Corps d'approbation invalide ou tentative d'injecter un acteur, un état ou un scope client
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PostVariantNotFound:
      description: Variante introuvable dans le workspace autorisé
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ApprovalStalePayload:
      description: approvalId ou hash ne correspond plus à la version courante
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ApprovalDecisionFinal:
      description: Une décision terminale opposée est déjà enregistrée
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidCalendarQuery:
      description: Query calendrier inconnue, bornes incomplètes ou fenêtre supérieure à 62 jours
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidInternalPostSchedule:
      description: Corps de planification interne invalide ou tentative d'injecter date, fuseau, scope, acteur ou état
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidTask:
      description: Corps de tâche invalide ou tentative de définir le scope, l'acteur, l'identifiant ou l'état client
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidTaskCompletion:
      description: Finalisation de tâche invalide ou corps non vide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TaskNotFound:
      description: Tâche introuvable dans le workspace autorisé
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TaskNotActionable:
      description: Tâche dans un état final autre que DONE, non finalisable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    DuplicateMedia:
      description: Un média avec le même SHA-256 existe déjà dans ce workspace
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MediaFileTooLarge:
      description: Le fichier dépasse la limite d'import de 25 MiB
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaFile:
      description: Le couple MIME/extension n'est pas autorisé pour l'import local
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Ressource de démonstration introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Outil non autorisé par la policy serveur
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Health:
      type: object
      required: [status, service, mode, database]
      properties:
        status:
          const: ok
        service:
          const: ida-api
        mode:
          const: LOCAL_DEMO
        database:
          const: ready
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    DemoIdentity:
      type: object
      required: [id, email, displayName, timezone, workspace, authentication]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        timezone:
          type: string
        workspace:
          $ref: '#/components/schemas/Workspace'
        authentication:
          type: object
          required: [mode, message]
          properties:
            mode:
              const: LOCAL_DEMO
            message:
              type: string
    Workspace:
      type: object
      required: [id, name, timezone, locale, role]
      properties:
        id:
          type: string
        name:
          type: string
        timezone:
          type: string
        locale:
          type: string
        role:
          enum: [OWNER, EDITOR, VIEWER]
    Module:
      type: object
      required: [key, label, route, description]
      properties:
        key:
          enum: [HOME, IDA, MUSIC, CONTENT, SOCIAL, CALENDAR, CAMPAIGNS, ANALYTICS, TASKS, MEMORY, SYSTEM]
        label:
          type: string
        route:
          type: string
        description:
          type: string
    ModuleListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Module'
    SystemStatus:
      type: object
      required: [component, state, message, checkedAt]
      properties:
        component:
          enum: [AI, DATABASE, STORAGE, SOCIAL_ACCOUNTS, SCHEDULER, NOTIFICATIONS]
        state:
          enum: [ONLINE, WARNING, ERROR, DISCONNECTED]
        message:
          type: string
        checkedAt:
          type: string
          format: date-time
    SystemStatusListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SystemStatus'
    ActivityLogAction:
      type: string
      enum:
        - campaign.created
        - campaign.release_linked
        - campaign.release_unlinked
        - track.created
        - media.imported
        - memory.proposed
        - memory.confirmed
        - memory.rejected
        - post_variant.approved
        - post_variant.rejected
        - post_variant.internal_scheduled
        - task.created
        - task.completed
    ActivityLogEntityType:
      type: string
      enum: [CAMPAIGN, TRACK, MEDIA_ASSET, MEMORY, POST_VARIANT, TASK]
    ActivityLog:
      type: object
      additionalProperties: false
      required: [id, action, entityType, entityId, createdAt]
      properties:
        id:
          type: string
          minLength: 1
        action:
          $ref: '#/components/schemas/ActivityLogAction'
        entityType:
          $ref: '#/components/schemas/ActivityLogEntityType'
        entityId:
          type: string
          minLength: 1
        createdAt:
          type: string
          format: date-time
    ActivityLogPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/ActivityLog'
        nextCursor:
          type: string
          minLength: 1
          maxLength: 512
          pattern: '^[A-Za-z0-9_-]+$'
    ActivityLogListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ActivityLogPage'
    ArtistProfile:
      type: object
      required: [id, workspaceId, artistProjectId, identity, genres, influences, tone, preferredVocabulary, forbiddenVocabulary, goals, audience, platformPreferences, createdAt, updatedAt]
      properties:
        id:
          type: string
        workspaceId:
          type: string
        artistProjectId:
          type: string
        identity:
          type: string
        genres:
          type: array
          items: { type: string }
        influences:
          type: array
          items: { type: string }
        tone:
          type: string
        preferredVocabulary:
          type: array
          items: { type: string }
        forbiddenVocabulary:
          type: array
          items: { type: string }
        goals:
          type: array
          items: { type: string }
        audience:
          type: string
        platformPreferences:
          $ref: '#/components/schemas/ArtistPlatformPreferences'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ArtistProfileResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ArtistProfile'
    ArtistProfileUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        identity: { type: string, minLength: 1, maxLength: 2000 }
        genres:
          type: array
          maxItems: 60
          items: { type: string, minLength: 1, maxLength: 240 }
        influences:
          type: array
          maxItems: 60
          items: { type: string, minLength: 1, maxLength: 240 }
        tone: { type: string, minLength: 1, maxLength: 2000 }
        preferredVocabulary:
          type: array
          maxItems: 60
          items: { type: string, minLength: 1, maxLength: 240 }
        forbiddenVocabulary:
          type: array
          maxItems: 60
          items: { type: string, minLength: 1, maxLength: 240 }
        goals:
          type: array
          maxItems: 60
          items: { type: string, minLength: 1, maxLength: 240 }
        audience: { type: string, minLength: 1, maxLength: 2000 }
        platformPreferences:
          $ref: '#/components/schemas/ArtistPlatformPreferences'
    ArtistPlatformPreferences:
      type: object
      maxProperties: 12
      additionalProperties:
        $ref: '#/components/schemas/ArtistPlatformPreference'
    ArtistPlatformPreference:
      type: object
      additionalProperties: false
      properties:
        preferredFormats:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 240 }
        cadencePerWeek:
          type: integer
          minimum: 0
          maximum: 31
        notes:
          type: string
          minLength: 1
          maxLength: 2000
    Release:
      type: object
      required: [id, workspaceId, artistProjectId, title, releaseType, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        artistProjectId: { type: string }
        title: { type: string }
        releaseType: { type: string }
        releaseDate: { type: string, format: date }
        label: { type: string }
        status:
          enum: [DRAFT, SCHEDULED, RELEASED, ARCHIVED]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReleaseListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Release'
    CampaignStatus:
      enum: [DRAFT, ACTIVE, PAUSED, COMPLETED, ARCHIVED]
    Campaign:
      type: object
      additionalProperties: false
      required: [id, workspaceId, artistProjectId, name, objective, status, version, createdAt, updatedAt]
      properties:
        id: { type: string, minLength: 1 }
        workspaceId: { type: string, minLength: 1 }
        artistProjectId: { type: string, minLength: 1 }
        name: { type: string, minLength: 1, maxLength: 240 }
        objective: { type: string, minLength: 1, maxLength: 2000 }
        status:
          $ref: '#/components/schemas/CampaignStatus'
        releaseId:
          type: string
          minLength: 1
        releaseTitle:
          type: string
          minLength: 1
          maxLength: 240
        version:
          type: integer
          minimum: 1
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CampaignCreateRequest:
      type: object
      additionalProperties: false
      required: [name, objective]
      properties:
        name: { type: string, minLength: 1, maxLength: 240 }
        objective: { type: string, minLength: 1, maxLength: 2000 }
    CampaignReleaseLinkRequest:
      type: object
      additionalProperties: false
      required: [releaseId, expectedVersion]
      properties:
        releaseId:
          oneOf:
            - type: string
              minLength: 1
            - type: 'null'
        expectedVersion:
          type: integer
          minimum: 1
    CampaignResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Campaign'
    CampaignListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Campaign'
    Track:
      type: object
      required: [id, workspaceId, artistProjectId, title, artistCredit, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        artistProjectId: { type: string }
        releaseId: { type: string }
        title: { type: string, minLength: 1, maxLength: 240 }
        artistCredit: { type: string, minLength: 1, maxLength: 240 }
        genre: { type: string, minLength: 1, maxLength: 120 }
        bpm: { type: number, exclusiveMinimum: 0, maximum: 400 }
        musicalKey: { type: string, minLength: 1, maxLength: 32 }
        releaseDate: { type: string, format: date }
        label: { type: string, minLength: 1, maxLength: 240 }
        status:
          enum: [DEMO, UNRELEASED, SCHEDULED, RELEASED, ARCHIVED]
        links:
          type: array
          items: { type: string, format: uri }
        tags:
          type: array
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, minLength: 1, maxLength: 4000 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TrackCreateRequest:
      type: object
      required: [title, artistCredit, status]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 240 }
        artistCredit: { type: string, minLength: 1, maxLength: 240 }
        genre: { type: string, minLength: 1, maxLength: 120 }
        bpm: { type: number, exclusiveMinimum: 0, maximum: 400 }
        musicalKey: { type: string, minLength: 1, maxLength: 32 }
        releaseDate: { type: string, format: date }
        label: { type: string, minLength: 1, maxLength: 240 }
        status:
          enum: [DEMO, UNRELEASED, SCHEDULED, RELEASED, ARCHIVED]
        tags:
          type: array
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, minLength: 1, maxLength: 4000 }
    TrackResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Track'
    TrackListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Track'
    MediaStatus:
      enum: [UNUSED, USED, SCHEDULED, PUBLISHED, ARCHIVED]
    MediaType:
      enum: [AUDIO, IMAGE, VIDEO, DOCUMENT, OTHER]
    MediaImportRequest:
      type: object
      required: [file]
      additionalProperties: false
      properties:
        file:
          type: string
          format: binary
          description: >-
            Un fichier privé de 25 MiB maximum. MIME et extension doivent former
            un couple autorisé par le serveur.
        description:
          type: string
          minLength: 1
          maxLength: 4000
        tags:
          type: string
          description: Liste de 30 tags maximum, séparés par des virgules.
          maxLength: 4096
    MediaAsset:
      type: object
      required: [id, workspaceId, artistProjectId, filename, type, mimeType, size, hash, tags, status, usageCount, createdAt, updatedAt]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        artistProjectId: { type: string }
        filename: { type: string }
        type:
          $ref: '#/components/schemas/MediaType'
        mimeType: { type: string }
        size: { type: integer, minimum: 0 }
        hash: { type: string }
        tags:
          type: array
          items: { type: string }
        status:
          $ref: '#/components/schemas/MediaStatus'
        usageCount: { type: integer, minimum: 0 }
        lastUsedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MediaListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MediaAsset'
    MediaAssetResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/MediaAsset'
    Memory:
      type: object
      required: [id, workspaceId, category, content, state, createdAt, updatedAt]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        category:
          enum: [ARTIST_MEMORY, CONTENT_MEMORY, CAMPAIGN_MEMORY, SOCIAL_MEMORY, PREFERENCE_MEMORY, SYSTEM_MEMORY]
        content: { type: string, minLength: 1, maxLength: 4000 }
        state:
          enum: [PENDING, CONFIRMED, REJECTED]
        confirmedBy: { type: string }
        confirmedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MemoryProposalRequest:
      type: object
      required: [content]
      additionalProperties: false
      properties:
        content: { type: string, minLength: 1, maxLength: 4000 }
    MemoryResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Memory'
    MemoryListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Memory'
    ApprovalState:
      enum: [REQUESTED, APPROVED, REJECTED, INVALIDATED]
    ApprovalMediaSummary:
      type: object
      additionalProperties: false
      required: [id, filename, type, status]
      properties:
        id: { type: string, minLength: 1 }
        filename: { type: string, minLength: 1, maxLength: 255 }
        type: { enum: [IMAGE, VIDEO, AUDIO, DOCUMENT, OTHER] }
        status: { enum: [UNUSED, USED, SCHEDULED, PUBLISHED, ARCHIVED] }
    ApprovalQueueItem:
      type: object
      additionalProperties: false
      required:
        - approvalId
        - variantId
        - postId
        - postTitle
        - platform
        - media
        - caption
        - hashtags
        - objective
        - timezone
        - payloadHash
        - approvalState
        - deliveryState
        - requestedAt
      properties:
        approvalId: { type: string, minLength: 1 }
        variantId: { type: string, minLength: 1 }
        postId: { type: string, minLength: 1 }
        postTitle: { type: string, minLength: 1, maxLength: 240 }
        platform: { enum: [INSTAGRAM, TIKTOK, YOUTUBE, FACEBOOK] }
        media:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ApprovalMediaSummary'
        caption: { type: string, minLength: 1, maxLength: 4000 }
        hashtags:
          type: array
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 100 }
        cta: { type: string, minLength: 1, maxLength: 500 }
        objective: { type: string, minLength: 1, maxLength: 2000 }
        rationale: { type: string, minLength: 1, maxLength: 4000 }
        plannedAt: { type: string, format: date-time }
        timezone: { type: string, minLength: 1, maxLength: 120 }
        payloadHash:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
        approvalState: { const: REQUESTED }
        deliveryState: { const: NOT_CONFIGURED }
        requestedAt: { type: string, format: date-time }
    ApprovalQueueResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalQueueItem'
    PostVariantDecisionRequest:
      type: object
      additionalProperties: false
      required: [approvalId, expectedPayloadHash]
      properties:
        approvalId: { type: string, minLength: 1 }
        expectedPayloadHash:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
    PostVariantDecision:
      type: object
      additionalProperties: false
      required: [approvalId, variantId, approvalState, deliveryState, payloadHash, decidedAt]
      properties:
        approvalId: { type: string, minLength: 1 }
        variantId: { type: string, minLength: 1 }
        approvalState: { enum: [APPROVED, REJECTED] }
        deliveryState: { const: NOT_CONFIGURED }
        payloadHash:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
        decidedAt: { type: string, format: date-time }
    PostVariantDecisionResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/PostVariantDecision'
    CalendarView:
      enum: [DAY, WEEK, MONTH]
    CalendarRange:
      type: object
      additionalProperties: false
      required: [view, from, to, timezone]
      properties:
        view:
          $ref: '#/components/schemas/CalendarView'
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        timezone: { type: string, minLength: 1, maxLength: 120 }
    CalendarItem:
      type: object
      additionalProperties: false
      required: [id, kind, variantId, postId, postTitle, platform, scheduledAt, timezone, state, approvalId, payloadHash]
      properties:
        id: { type: string, minLength: 1 }
        kind: { enum: [INTERNAL_SCHEDULE, APPROVED_VARIANT] }
        variantId: { type: string, minLength: 1 }
        postId: { type: string, minLength: 1 }
        postTitle: { type: string, minLength: 1, maxLength: 240 }
        platform: { enum: [INSTAGRAM, TIKTOK, YOUTUBE, FACEBOOK] }
        scheduledAt: { type: string, format: date-time }
        timezone: { type: string, minLength: 1, maxLength: 120 }
        state: { enum: [SCHEDULED_INTERNAL, READY_TO_SCHEDULE] }
        approvalId: { type: string, minLength: 1 }
        payloadHash:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
    CalendarData:
      type: object
      additionalProperties: false
      required: [range, items]
      properties:
        range:
          $ref: '#/components/schemas/CalendarRange'
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/CalendarItem'
    CalendarResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CalendarData'
    InternalPostScheduleRequest:
      type: object
      additionalProperties: false
      required: [approvalId, expectedPayloadHash]
      properties:
        approvalId: { type: string, minLength: 1 }
        expectedPayloadHash:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
    InternalPostSchedule:
      type: object
      additionalProperties: false
      required: [id, variantId, postId, platform, scheduledAt, timezone, state, approvalId, payloadHash, deliveryState]
      properties:
        id: { type: string, minLength: 1 }
        variantId: { type: string, minLength: 1 }
        postId: { type: string, minLength: 1 }
        platform: { enum: [INSTAGRAM, TIKTOK, YOUTUBE, FACEBOOK] }
        scheduledAt: { type: string, format: date-time }
        timezone: { type: string, minLength: 1, maxLength: 120 }
        state: { enum: [SCHEDULED, CANCELLED] }
        approvalId: { type: string, minLength: 1 }
        payloadHash:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
        deliveryState: { const: NOT_CONFIGURED }
    InternalPostScheduleResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/InternalPostSchedule'
    TaskStatus:
      enum: [TODO, IN_PROGRESS, DONE, CANCELLED]
    Task:
      type: object
      required: [id, workspaceId, title, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        title: { type: string, minLength: 1, maxLength: 240 }
        description: { type: string, minLength: 1, maxLength: 4000 }
        status:
          $ref: '#/components/schemas/TaskStatus'
        dueAt: { type: string, format: date-time }
        completedBy: { type: string }
        completedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TaskCreateRequest:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 240 }
        description: { type: string, minLength: 1, maxLength: 4000 }
        dueAt: { type: string, format: date-time }
    TaskResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Task'
    TaskListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Task'
    SocialPlatformCapability:
      type: object
      required: [platform, apiVersion, oauthSupported, draftSupported, scheduleSupported, publishSupported, analyticsSupported, requiresHumanApproval, requiresPlatformReview, notes]
      properties:
        platform:
          enum: [INSTAGRAM, TIKTOK, YOUTUBE, FACEBOOK]
        apiVersion: { type: string }
        oauthSupported: { type: boolean }
        draftSupported: { type: boolean }
        scheduleSupported: { type: boolean }
        publishSupported: { type: boolean }
        analyticsSupported: { type: boolean }
        requiresHumanApproval: { const: true }
        requiresPlatformReview: { type: boolean }
        notes:
          type: array
          items: { type: string }
    SocialPlatformListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SocialPlatformCapability'
    IdaCommandRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4000
      additionalProperties: true
    IdaCommandResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [command, kind, message, tools, result]
          properties:
            command:
              type: object
              required: [id, workspaceId, message, intent, state, requestedPermission, createdAt, updatedAt]
              properties:
                id: { type: string }
                workspaceId: { type: string }
                message: { type: string }
                intent:
                  enum: [PREPARE_DAY, LIST_UNUSED_CONTENT, UNKNOWN]
                state:
                  const: COMPLETED
                requestedPermission:
                  const: READ
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }
            kind:
              enum: [TODAY, UNUSED_CONTENT, SYSTEM, HELP]
            message: { type: string }
            tools:
              type: array
              items:
                type: object
                required: [key, moduleKey, permission]
                properties:
                  key: { type: string }
                  moduleKey:
                    enum: [TASKS, CONTENT, SYSTEM, IDA]
                  permission:
                    const: READ
            result:
              type: object
              additionalProperties: true
