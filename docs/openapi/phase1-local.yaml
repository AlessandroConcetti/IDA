          enum: [INSTAGRAM, TIKTOK, YOUTUBE, FACEBOOK]
        apiVersion:
          type: string
          description: Version de la matrice déclarative, pas une session OAuth.
        oauthSupported:
          type: boolean
          description: Capacité documentée à étudier ; aucun compte n'est connecté.
        draftSupported: { type: boolean }
        scheduleSupported: { type: boolean }
        publishSupported: { type: boolean }
        analyticsSupported: { type: boolean }
        requiresHumanApproval:
          type: boolean
          const: true
        requiresPlatformReview:
          type: boolean
        notes:
          type: array
          items: { type: string }
        verifiedAt:
          type: string
          format: date-time
          description: Date de revue de la matrice, pas une vérification en direct d'un compte.
    SocialPlatformListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SocialPlatformCapability'
    IdaCommandIntent:
      type: string
      enum: [UNKNOWN, PREPARE_DAY, SEARCH_MEDIA, SEARCH_TRACK, LIST_UNUSED_CONTENT, CREATE_POST, UPDATE_POST, SCHEDULE_POST, ANALYZE_PERFORMANCE, CREATE_CAMPAIGN, GET_CALENDAR, CONNECT_SOCIAL_ACCOUNT, EXPLAIN_PROPOSAL, SAVE_MEMORY]
    IdaCommandState:
      type: string
      enum: [RECEIVED, UNDERSTOOD, PLANNED, AWAITING_APPROVAL, EXECUTING, COMPLETED, FAILED, CANCELLED]
    IdaCommandRun:
      type: object
      additionalProperties: false
      required: [id, intent, state, requestedPermission, message, responseMessage, createdAt]
      properties:
        id: { type: string }
        intent:
          $ref: '#/components/schemas/IdaCommandIntent'
        state:
          $ref: '#/components/schemas/IdaCommandState'
        requestedPermission:
          enum: [READ, WRITE, APPROVAL_REQUIRED, PUBLISH, SYSTEM]
        message:
          type: string
          minLength: 1
          maxLength: 4000
        responseMessage:
          type: string
          minLength: 1
          maxLength: 4000
        createdAt:
          type: string
          format: date-time
    IdaCommandRunPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/IdaCommandRun'
        nextCursor:
          type: string
          minLength: 1
          maxLength: 512
          pattern: '^[A-Za-z0-9_-]+$'
    IdaCommandRunListResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/IdaCommandRunPage'
    IdaCommandRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4000
      additionalProperties: true
    IdaCommandResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [commandRunId, state, command, kind, message, tools, result]
          properties:
            commandRunId: { type: string }
            state:
              const: COMPLETED
            command:
              type: object
              required: [id, workspaceId, message, intent, state, requestedPermission, createdAt, updatedAt]
              properties:
                id: { type: string }
                workspaceId: { type: string }
                message: { type: string }
                intent:
                  enum: [PREPARE_DAY, LIST_UNUSED_CONTENT, UNKNOWN]
                state:
                  const: COMPLETED
                requestedPermission:
                  const: READ
                createdAt: { type: string, format: date-time }
                updatedAt: { type: string, format: date-time }
            kind:
              enum: [TODAY, TOMORROW, UNUSED_CONTENT, SYSTEM, HELP]
            message: { type: string }
            tools:
              type: array
              items:
                type: object
                required: [key, moduleKey, permission]
                properties:
                  key: { type: string }
                  moduleKey:
                    enum: [TASKS, CONTENT, SYSTEM, IDA]
                  permission:
                    const: READ
            result:
              type: object
              additionalProperties: true
              description: >-
                Résultat borné par le kind. Pour UNUSED_CONTENT, items contient
                uniquement des ContentRotationCandidate AVAILABLE : aucun hash,
                stockage, compteur, statut brut ou média déjà lié n’est rendu.
                Pour TODAY ou TOMORROW, les items ne contiennent que les tâches
                à échéance et les éléments éditoriaux internes valides de la
                fenêtre civile du workspace ; une planification interne n'est
                jamais une livraison sociale.
