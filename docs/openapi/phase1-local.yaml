openapi: 3.1.0
info:
  title: IDA local Phase 1 API
  version: 0.1.0
  description: >-
    Contrat du runtime de développement local. Il expose uniquement des données
    de démonstration, des commandes IDA déterministes en lecture seule, une
    modification interne bornée de l’Artist Brain, une création Music Brain
    strictement contrôlée, un registre de briefs de campagne internes avec lien
    de release contrôlé, un flux
    de mémoire consentie local, un Approval Center interne sans livraison et
    un Task Center interne contrôlé, ainsi qu’un registre d’agents strictement
    déclaratif sans exécution. Toutes les routes /v1 sont précédées d'une
    résolution Identity locale persistée ; aucun credential client n'est encore
    accepté et ce mécanisme ne constitue pas une authentification de production.
servers:
  - url: http://127.0.0.1:8787
    description: API locale de développement
x-ida-local-identity-guard:
  appliesTo: /v1/**
  sessionSelector: fixé côté serveur
  requestContextAttached: true
  actionPermissionIntersection: membership-role + client-grant + tool-permission
  clientCredentialAccepted: false
  failureStatus: 401
  failureCode: AUTHENTICATION_REQUIRED
paths:
  /health:
    get:
      operationId: getHealth
      summary: Vérifie la disponibilité du runtime local
      responses:
        '200':
          description: Runtime disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/me:
    get:
      operationId: getDemoIdentity
      summary: Retourne l'identité locale de démonstration
      responses:
        '200':
          description: Identité et workspace fixés côté serveur
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/DemoIdentity'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /v1/modules:
    get:
      operationId: listModules
      summary: Liste les modules déclarés du Command Center
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Modules de l'interface commune
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleListResponse'
  /v1/agents:
    get:
      operationId: listAgentManifests
      summary: Liste les manifestes déclaratifs d’agents
      description: >-
        Lecture sans paramètre et sans effet. Elle expose des contrats revus,
        jamais un prompt, secret, token, état d’exécution ni capacité d’appel
        d’outil. Les manifestes locaux restent planifiés.
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Manifestes versionnés, déclaratifs et non exécutables
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentManifestListResponse'
  /v1/system/status:
    get:
      operationId: getSystemStatus
      summary: Retourne les états système observés
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: États du runtime local et des intégrations absentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatusListResponse'
  /v1/dashboard/summary:
    get:
      operationId: getDashboardSummary
      summary: Retourne les indicateurs factuels du Command Center
      description: >-
        Lecture sans paramètre du workspace résolu côté serveur. Les
        planifications comptées sont uniquement des snapshots internes actifs,
        jamais des livraisons ou publications sociales.
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Résumé borné du Command Center et date du workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummaryResponse'
        '400':
          $ref: '#/components/responses/InvalidDashboardSummaryQuery'
  /v1/activity-logs:
    get:
      operationId: listActivityLogs
      summary: Liste une projection sûre de l’activité locale
      description: >-
        Lecture seule de l’audit, limitée au workspace imposé par le serveur.
        La réponse ne contient que id, action, entityType, entityId et createdAt.
        Elle ne sélectionne ni payload, acteur, workspace, caption, hash, token,
        chemin ou média privé. Seules les actions Phase 1 explicitement
        autorisées sont visibles ; les futurs domaines sensibles restent masqués.
      parameters:
        - name: limit
          in: query
          required: false
          description: Nombre d’éléments par page ; 20 par défaut.
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 20
        - name: cursor
          in: query
          required: false
          description: Curseur de continuation Base64URL, à traiter comme opaque par le client.
          schema:
            type: string
            minLength: 1
            maxLength: 512
            pattern: '^[A-Za-z0-9_-]+$'
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Page d’activité sûre, triée par createdAt puis id décroissants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityLogListResponse'
        '400':
          $ref: '#/components/responses/InvalidActivityLogQuery'
  /v1/artist-profile:
    get:
      operationId: getArtistProfile
      summary: Retourne le profil artistique de démonstration
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Artist Brain de démonstration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistProfileResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateArtistProfile
      summary: Met à jour une partie de l’Artist Brain local
      description: >-
        Utilise le contexte workspace imposé par le serveur et l’outil interne
        update_artist_profile avec la permission WRITE. Aucun champ de scope,
        appel externe ou effet de publication n’est accepté.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtistProfileUpdateRequest'
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Artist Brain local mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistProfileResponse'
        '400':
          $ref: '#/components/responses/InvalidArtistProfile'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/releases:
    get:
      operationId: listReleases
      summary: Liste les releases locales du Music Brain
      description: >-
        Lecture du workspace résolu côté serveur. Elle ne retourne aucune
        relation de track ou média, aucun lien externe et n'écrit aucun audit.
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Releases du workspace local
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseListResponse'
    post:
      operationId: createRelease
      summary: Crée une release locale dans le Music Brain
      description: >-
        Accepte uniquement les métadonnées locales de la release. Le serveur
        impose workspace, projet, acteur, identifiant et timestamps, puis passe
        par l'outil allowlisté create_release avec MUSIC/WRITE. La route ne
        relie ni track, ni média, ni lien externe et ne déclenche aucun effet
        social, calendrier ou publication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseCreateRequest'
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '201':
          description: Release locale créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseResponse'
        '400':
          $ref: '#/components/responses/InvalidRelease'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/campaigns:
    get:
      operationId: listCampaignBriefs
      summary: Liste les briefs de campagne internes du workspace local
      description: >-
        Lecture isolée au workspace résolu côté serveur. Les briefs ne portent
        que leurs liens optionnels de release et morceau; ils ne portent encore
        ni date, ni pilier, ni contenu ou effet externe.
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Briefs de campagne internes dans un ordre stable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignListResponse'
    post:
      operationId: createCampaignBrief
      summary: Crée un brief de campagne interne DRAFT
      description: >-
        Accepte uniquement name et objective. Le serveur impose workspace,
        projet, acteur, identifiant et état DRAFT puis passe par l'outil
        allowlisté create_campaign avec CAMPAIGNS/WRITE. Cette route ne crée
        aucun lien de release, contenu, calendrier, tâche, notification ou
        appel externe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignCreateRequest'
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '201':
          description: Brief de campagne DRAFT créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResponse'
        '400':
          $ref: '#/components/responses/InvalidCampaign'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CampaignAlreadyExists'
  /v1/campaigns/{campaignId}/release:
    patch:
      operationId: linkCampaignBriefRelease
      summary: Rattache ou retire la release d’un Campaign Brief
      description: >-
        Reçoit une release existante ou null et une version attendue. Le serveur
        vérifie que la campagne et la release partagent le workspace et le projet
        artistique, applique une écriture conditionnelle versionnée et appelle
        uniquement link_campaign_release avec CAMPAIGNS/WRITE. Aucun contenu,
        date, planification, IA ou effet social n’est créé.
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignReleaseLinkRequest'
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Lien déjà présent ou campagne mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResponse'
        '400':
          $ref: '#/components/responses/InvalidCampaignReleaseLink'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CampaignOrReleaseNotFound'
        '409':
          $ref: '#/components/responses/CampaignStale'
  /v1/campaigns/{campaignId}/track:
    patch:
      operationId: linkCampaignBriefTrack
      summary: Rattache ou retire le morceau d’un Campaign Brief
      description: >-
        Reçoit un morceau existant ou null et une version attendue. Le serveur
        vérifie que la campagne et le morceau partagent le workspace et le projet
        artistique, applique une écriture conditionnelle versionnée et appelle
        uniquement link_campaign_track avec CAMPAIGNS/WRITE. Aucun contenu,
        date, planification, IA ou effet social n’est créé.
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignTrackLinkRequest'
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Lien déjà présent ou campagne mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResponse'
        '400':
          $ref: '#/components/responses/InvalidCampaignTrackLink'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CampaignOrTrackNotFound'
        '409':
          $ref: '#/components/responses/CampaignStale'
  /v1/tracks:
    get:
      operationId: listTracks
      summary: Liste les tracks de démonstration
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Tracks du workspace local
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackListResponse'
    post:
      operationId: createTrack
      summary: Ajoute un morceau interne au Music Brain local
      description: >-
        Utilise le contexte workspace, le projet et l'acteur imposés par le
        serveur, puis l'outil interne allowlisté create_track avec la permission
        WRITE. releaseId est la seule relation admise : elle doit désigner une
        release du même workspace et projet artistique. Aucun champ de scope,
        upload, association média ou effet externe n'est accepté.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackCreateRequest'
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '201':
          description: Morceau local créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackResponse'
        '400':
          $ref: '#/components/responses/InvalidTrack'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TrackReleaseNotFound'
  /v1/media:
    get:
      operationId: listMedia
      summary: Recherche les métadonnées de médias du workspace local
      description: >-
        Lecture locale bornée et sans effet d'écriture. Les filtres se
        cumulent ; le workspace est résolu côté serveur et ne peut pas être
        fourni par le client. Les filtres releaseId et trackId lisent seulement
        des références déjà portées par les assets de ce workspace : une valeur
        étrangère ou inconnue retourne une liste vide. La réponse ne contient
        jamais de clé, chemin ou URL de stockage. previewAvailable indique
        uniquement l'éligibilité à une route d'aperçu privée autorisée.
      parameters:
        - name: q
          in: query
          required: false
          description: Recherche littérale dans le nom, la description et les tags.
          schema:
            type: string
            minLength: 1
            maxLength: 160
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MediaStatus'
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MediaType'
        - name: tag
          in: query
          required: false
          description: Tag exact, normalisé côté serveur.
          schema:
            type: string
            minLength: 1
            maxLength: 80
        - name: releaseId
          in: query
          required: false
          description: Référence de release déjà liée aux assets du workspace, sans résolution externe.
          schema:
            type: string
            minLength: 1
        - name: trackId
          in: query
          required: false
          description: Référence de morceau déjà liée aux assets du workspace, sans résolution externe.
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          required: false
          description: 50 par défaut ; la pagination par curseur n'est pas encore livrée.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Médias filtrés dans le workspace local
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaListResponse'
        '400':
          $ref: '#/components/responses/InvalidMediaQuery'
    post:
      operationId: importMedia
      summary: Importe un média local privé dans la Content Library
      description: >-
        Accepte exactement un fichier et les champs texte optionnels description
        et tags (liste séparée par des virgules), ainsi que les références
        optionnelles releaseId et trackId. Chaque référence doit appartenir au
        même workspace et projet artistique que le média. Le workspace, le
        projet et l'acteur sont imposés par le serveur ; l'outil interne
        allowlisté import_media utilise CONTENT/WRITE. Aucun chemin, URL de
        stockage, scope client, publication ou appel externe n'est accepté.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MediaImportRequest'
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '201':
          description: Média privé importé dans le workspace local
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAssetResponse'
        '400':
          $ref: '#/components/responses/InvalidMediaImport'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/MediaReferenceNotFound'
        '409':
          $ref: '#/components/responses/DuplicateMedia'
        '413':
          $ref: '#/components/responses/MediaFileTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaFile'
  /v1/media/{mediaId}/preview:
    get:
      operationId: previewPrivateMedia
      summary: Sert un aperçu privé local d'un média importé
      description: >-
        Lecture sans effet d'écriture d'une image, vidéo ou audio importé dans
        le workspace résolu côté serveur. Aucun chemin, clé, URL de stockage,
        workspace ou paramètre de fichier ne vient du client. La réponse garde
        le MIME validé, Cache-Control private, no-store et accepte une seule
        plage HTTP bytes. Un PDF ou un média sans fichier local est traité
        comme absent, sans détail sur le stockage.
      parameters:
        - name: mediaId
          in: path
          required: true
          description: Identifiant opaque du média du workspace courant.
          schema:
            type: string
            maxLength: 80
            pattern: '^med_[A-Za-z0-9_]+$'
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Média privé complet, avec son Content-Type validé.
          headers:
            Accept-Ranges:
              schema: { type: string, enum: [bytes] }
            Cache-Control:
              schema: { type: string, enum: ['private, no-store'] }
            Content-Length:
              schema: { type: integer, minimum: 0 }
        '206':
          description: Plage unique du média privé.
          headers:
            Accept-Ranges:
              schema: { type: string, enum: [bytes] }
            Cache-Control:
              schema: { type: string, enum: ['private, no-store'] }
            Content-Length:
              schema: { type: integer, minimum: 0 }
            Content-Range:
              schema: { type: string }
        '400':
          description: Identifiant de média invalide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Aperçu absent, hors workspace ou non disponible localement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '416':
          description: Plage HTTP invalide pour le média privé.
          headers:
            Content-Range:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/content/rotation:
    get:
      operationId: listContentRotationCandidates
      summary: Liste les médias réellement disponibles pour une rotation
      description: >-
        Lecture locale, bornée et sans effet d'écriture. Elle retourne
        uniquement les médias UNUSED du workspace résolu côté serveur qui ne
        possèdent aucun lien post_variant_media. Elle ne calcule aucun score
        de fraîcheur et n'expose ni hash, stockage, compteur d'usage ni lien.
      parameters:
        - name: limit
          in: query
          required: false
          description: 12 par défaut.
          schema:
            type: integer
            minimum: 1
            maximum: 12
            default: 12
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Candidats disponibles dans un ordre stable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentRotationResponse'
        '400':
          $ref: '#/components/responses/InvalidContentRotationQuery'
  /v1/memories:
    get:
      operationId: listMemories
      summary: Liste les mémoires du workspace local avec leurs timestamps persistés
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Mémoires structurées du workspace local
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryListResponse'
  /v1/memories/proposals:
    post:
      operationId: createMemoryProposal
      summary: Propose une préférence durable qui reste en attente de consentement
      description: >-
        Accepte uniquement le contenu d'une préférence. Le serveur impose le
        workspace, l'acteur, l'identifiant, PREFERENCE_MEMORY et PENDING ; la
        proposition ne devient jamais permanente avant une confirmation séparée.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryProposalRequest'
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '201':
          description: Proposition PENDING créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryResponse'
        '400':
          $ref: '#/components/responses/InvalidMemoryProposal'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/memories/{memoryId}/confirm:
    post:
      operationId: confirmMemory
      summary: Confirme explicitement une proposition PENDING
      description: >-
        Ne reçoit aucun corps. La transition atomique PENDING vers CONFIRMED est
        immuable après succès et est limitée au workspace serveur.
      parameters:
        - $ref: '#/components/parameters/MemoryId'
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Mémoire confirmée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryResponse'
        '400':
          $ref: '#/components/responses/InvalidMemoryDecision'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/MemoryNotFound'
        '409':
          $ref: '#/components/responses/MemoryDecisionFinal'
  /v1/memories/{memoryId}/reject:
    post:
      operationId: rejectMemory
      summary: Refuse explicitement une proposition PENDING
      description: >-
        Ne reçoit aucun corps. La transition atomique PENDING vers REJECTED est
        immuable après succès et est limitée au workspace serveur.
      parameters:
        - $ref: '#/components/parameters/MemoryId'
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Mémoire refusée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryResponse'
        '400':
          $ref: '#/components/responses/InvalidMemoryDecision'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/MemoryNotFound'
        '409':
          $ref: '#/components/responses/MemoryDecisionFinal'
  /v1/approvals/queue:
    get:
      operationId: listApprovalQueue
      summary: Liste les propositions REQUESTED à valider
      description: >-
        Retourne uniquement les demandes d'approbation du workspace résolu côté
        serveur. La date éventuelle est une date proposée, pas une publication
        programmée. Le hash couvre également titre, objectif, rationale
        éventuelle, texte et médias ordonnés. Les médias n'exposent que id,
        filename, type et status.
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: File d'approbations internes dans un ordre stable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalQueueResponse'
  /v1/calendar:
    get:
      operationId: getEditorialCalendar
      summary: Projette le calendrier éditorial interne
      description: >-
        Retourne les snapshots de planification interne encore valides et les
        variantes APPROVED prêtes à planifier. Les bornes from/to sont
        obligatoires ensemble, forment une plage [from, to) d'au plus 62 jours
        et sont dérivées dans le fuseau du workspace lorsqu'elles sont absentes.
        Aucun payload éditorial, média, compte ou secret n'est exposé.
      parameters:
        - name: view
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CalendarView'
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Projection bornée et triée du calendrier du workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarResponse'
        '400':
          $ref: '#/components/responses/InvalidCalendarQuery'
  /v1/post-variants/{variantId}/approve:
    post:
      operationId: approvePostVariant
      summary: Approuve humainement une version exacte de variante
      description: >-
        Vérifie approvalId et expectedPayloadHash dans le workspace serveur,
        construit ensuite la preuve humaine côté serveur et applique REQUESTED
        vers APPROVED. Ne programme ni ne publie aucun contenu.
      parameters:
        - $ref: '#/components/parameters/PostVariantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostVariantDecisionRequest'
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Décision APPROVED ou retry idempotent de la même décision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostVariantDecisionResponse'
        '400':
          $ref: '#/components/responses/InvalidApprovalDecision'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PostVariantNotFound'
        '409':
          description: Payload obsolète ou décision finale opposée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/post-variants/{variantId}/reject:
    post:
      operationId: rejectPostVariant
      summary: Refuse humainement une version exacte de variante
      description: >-
        Vérifie approvalId et expectedPayloadHash dans le workspace serveur,
        construit ensuite la preuve humaine côté serveur et applique REQUESTED
        vers REJECTED. Ne programme ni ne publie aucun contenu.
      parameters:
        - $ref: '#/components/parameters/PostVariantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostVariantDecisionRequest'
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Décision REJECTED ou retry idempotent de la même décision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostVariantDecisionResponse'
        '400':
          $ref: '#/components/responses/InvalidApprovalDecision'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PostVariantNotFound'
        '409':
          description: Payload obsolète ou décision finale opposée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/post-variants/{variantId}/internal-schedules:
    post:
      operationId: scheduleApprovedPostVariantInternally
      summary: Crée un snapshot de planification interne d'une variante approuvée
      description: >-
        Revalide l'approbation et le hash canonique dans le workspace serveur,
        puis copie exclusivement l'horaire et le fuseau approuvés. Cette route
        ne crée ni livraison, ni publication, ni appel réseau externe.
      parameters:
        - $ref: '#/components/parameters/PostVariantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalPostScheduleRequest'
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '201':
          description: Snapshot interne créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalPostScheduleResponse'
        '200':
          description: Retry exact d'un snapshot actif existant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalPostScheduleResponse'
        '400':
          $ref: '#/components/responses/InvalidInternalPostSchedule'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PostVariantNotFound'
        '409':
          description: Approbation obsolète, date indisponible ou créneau en conflit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/internal-post-schedules/{scheduleId}/cancel:
    post:
      operationId: cancelInternalPostSchedule
      summary: Annule un snapshot de planification interne
      description: >-
        Applique uniquement la transition SCHEDULED vers CANCELLED dans le
        workspace serveur. Le retry est idempotent, ne réécrit pas sa preuve
        d'annulation et ne crée aucune livraison, publication ou action réseau.
        Un snapshot devenu stale reste toujours annulable.
      parameters:
        - $ref: '#/components/parameters/InternalPostScheduleId'
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Snapshot annulé ou résultat idempotent déjà CANCELLED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalPostScheduleResponse'
        '400':
          $ref: '#/components/responses/InvalidInternalPostScheduleCancellation'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/InternalPostScheduleNotFound'
        '409':
          description: État de snapshot inattendu, non annulable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/tasks:
    get:
      operationId: listTasks
      summary: Liste les tâches du workspace local
      description: Les tâches sans échéance restent visibles ici, mais n'apparaissent pas dans la commande de journée civile.
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Tâches structurées du workspace local
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
    post:
      operationId: createTask
      summary: Crée une tâche interne TODO
      description: >-
        Accepte uniquement title, description optionnelle et dueAt optionnel.
        Le serveur impose l'identifiant, le workspace, l'acteur et l'état TODO.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '201':
          description: Tâche TODO créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/InvalidTask'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/tasks/{taskId}/complete:
    post:
      operationId: completeTask
      summary: Finalise une tâche active
      description: >-
        Ne reçoit aucun corps. Effectue TODO ou IN_PROGRESS vers DONE dans le
        workspace serveur. Un retry sur DONE est idempotent et ne produit pas de
        seconde écriture ni de second audit.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Tâche complétée ou résultat idempotent déjà DONE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/InvalidTaskCompletion'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '409':
          $ref: '#/components/responses/TaskNotActionable'
  /v1/social/platforms:
    get:
      operationId: listSocialPlatformCapabilities
      summary: Retourne les capacités sociales déclarées
      description: |
        Retourne une matrice déclarative de démonstration en lecture seule.
        Elle ne représente ni compte social, ni token, ni connexion OAuth réelle,
        ni scope accordé, ni autorisation d'action externe. La route ne lance pas
        OAuth, n'appelle aucune plateforme et n'écrit aucun audit.
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Capacités de démonstration à revalider avant intégration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialPlatformListResponse'
  /v1/ida/command-runs:
    get:
      operationId: listIdaCommandRuns
      summary: Retourne l’historique privé des commandes IDA terminées
      description: |
        Retourne uniquement les paires de messages de commandes READ /
        COMPLETED du même acteur dans le workspace résolu par le serveur.
        Ne retourne ni résultat d’outil,
        ni paramètres, ni prompt, ni payload, ni acteur ou workspace.
        Cette lecture n’écrit aucun audit et ne rejoue pas une commande.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 20
        - name: cursor
          in: query
          required: false
          description: Curseur opaque Base64URL de continuation.
          schema:
            type: string
            minLength: 1
            maxLength: 512
            pattern: '^[A-Za-z0-9_-]+$'
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Page de commandes terminées du workspace autorisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdaCommandRunListResponse'
        '400':
          $ref: '#/components/responses/InvalidCommandHistoryQuery'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/ida/commands:
    post:
      operationId: executeIdaCommand
      summary: Exécute une commande IDA déterministe et en lecture seule
      description: >-
        Une commande READ / COMPLETED est ajoutée à l’historique privé local,
        avec audit redacted sans texte libre, sans résultat détaillé d’outil ni
        mémoire implicite. La formulation « contenus inutilisés » sélectionne
        les médias réellement disponibles (UNUSED et sans lien éditorial) avec
        l’outil CONTENT/READ list_content_rotation_candidates ; elle ne crée
        aucun effet éditorial ou externe. Les demandes d’historique « jamais
        publié/utilisé » restent hors périmètre.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdaCommandRequest'
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Commande comprise et exécutée avec des outils READ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdaCommandResponse'
        '400':
          $ref: '#/components/responses/InvalidCommand'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  parameters:
    MemoryId:
      name: memoryId
      in: path
      required: true
      description: Identifiant de mémoire résolu dans le workspace serveur.
      schema:
        type: string
        minLength: 1
    PostVariantId:
      name: variantId
      in: path
      required: true
      description: Identifiant de variante résolu dans le workspace serveur.
      schema:
        type: string
        minLength: 1
    InternalPostScheduleId:
      name: scheduleId
      in: path
      required: true
      description: Identifiant de snapshot interne résolu dans le workspace serveur.
      schema:
        type: string
        minLength: 1
    TaskId:
      name: taskId
      in: path
      required: true
      description: Identifiant de tâche résolu dans le workspace serveur.
      schema:
        type: string
        minLength: 1
    CampaignId:
      name: campaignId
      in: path
      required: true
      description: Identifiant de campagne résolu dans le workspace serveur.
      schema:
        type: string
        minLength: 1
  responses:
    AuthenticationRequired:
      description: Le contexte Identity local fixé côté serveur est absent, suspendu, révoqué, expiré ou hors scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidCommand:
      description: Corps de commande ou filtre invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidCommandHistoryQuery:
      description: Query d’historique inconnue, dupliquée ou pagination invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidActivityLogQuery:
      description: Query d’activité inconnue, dupliquée ou pagination invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidArtistProfile:
      description: Corps Artist Brain invalide ou tentative de définir le scope client
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidTrack:
      description: Corps Music Brain invalide ou tentative de définir le scope client
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TrackReleaseNotFound:
      description: Release compatible introuvable dans le workspace et projet artistique autorisés
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidRelease:
      description: Corps Release Registry invalide ou tentative de définir le scope, les relations ou les liens externes client
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidCampaign:
      description: Corps Campaign Brief invalide ou tentative de définir le scope, le projet, l'acteur ou l'état client
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CampaignAlreadyExists:
      description: Un brief avec le même nom normalisé existe déjà dans ce workspace
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidCampaignReleaseLink:
      description: Corps de liaison release invalide ou tentative d’injecter un champ de campagne, scope ou acteur
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidCampaignTrackLink:
      description: Corps de liaison morceau invalide ou tentative d’injecter un champ de campagne, scope ou acteur
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CampaignOrReleaseNotFound:
      description: Campagne ou release compatible introuvable dans le scope autorisé
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CampaignOrTrackNotFound:
      description: Campagne ou morceau compatible introuvable dans le scope autorisé
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CampaignStale:
      description: La version de campagne attendue n’est plus courante
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidMediaImport:
      description: Formulaire media invalide, champ inattendu ou tentative de définir le scope client
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MediaReferenceNotFound:
      description: Release ou morceau compatible introuvable dans le workspace et projet artistique autorisés
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidMediaQuery:
      description: Filtre média invalide ou paramètre reconnu dupliqué
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidContentRotationQuery:
      description: Query de rotation inconnue, dupliquée ou limite invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidDashboardSummaryQuery:
      description: Query de résumé inconnue ou tentative d'injecter un scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidMemoryProposal:
      description: Proposition de mémoire invalide ou tentative de définir un état, un scope, un identifiant ou un acteur client
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidMemoryDecision:
      description: Décision de mémoire invalide ou corps non vide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MemoryNotFound:
      description: Mémoire introuvable dans le workspace autorisé
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MemoryDecisionFinal:
      description: La mémoire possède déjà un état final immuable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidApprovalDecision:
      description: Corps d'approbation invalide ou tentative d'injecter un acteur, un état ou un scope client
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PostVariantNotFound:
      description: Variante introuvable dans le workspace autorisé
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ApprovalStalePayload:
      description: approvalId ou hash ne correspond plus à la version courante
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ApprovalDecisionFinal:
      description: Une décision terminale opposée est déjà enregistrée
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidCalendarQuery:
      description: Query calendrier inconnue, bornes incomplètes ou fenêtre supérieure à 62 jours
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidInternalPostSchedule:
      description: Corps de planification interne invalide ou tentative d'injecter date, fuseau, scope, acteur ou état
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidInternalPostScheduleCancellation:
      description: Annulation de planification interne invalide ou corps non vide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalPostScheduleNotFound:
      description: Snapshot interne introuvable dans le workspace autorisé
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidTask:
      description: Corps de tâche invalide ou tentative de définir le scope, l'acteur, l'identifiant ou l'état client
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidTaskCompletion:
      description: Finalisation de tâche invalide ou corps non vide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TaskNotFound:
      description: Tâche introuvable dans le workspace autorisé
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TaskNotActionable:
      description: Tâche dans un état final autre que DONE, non finalisable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    DuplicateMedia:
      description: Un média avec le même SHA-256 existe déjà dans ce workspace
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MediaFileTooLarge:
      description: Le fichier dépasse la limite d'import de 25 MiB
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaFile:
      description: Le couple MIME/extension n'est pas autorisé pour l'import local
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Ressource de démonstration introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Permission Identity effective ou outil refusé par les policies serveur
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Health:
      type: object
      required: [status, service, mode, database]
      properties:
        status:
          const: ok
        service:
          const: ida-api
        mode:
          const: LOCAL_DEMO
        database:
          const: ready
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    DemoIdentity:
      type: object
      required: [id, email, displayName, timezone, workspace, client, authorization, authentication]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        timezone:
          type: string
        workspace:
          $ref: '#/components/schemas/Workspace'
        client:
          type: object
          additionalProperties: false
          required: [id, kind, platform, accessLevel]
          properties:
            id: { type: string }
            kind: { enum: [WEB_BROWSER, PWA, NATIVE_DESKTOP, NATIVE_MOBILE, TV] }
            platform: { enum: [WINDOWS, MACOS, LINUX, IOS, ANDROID, TV, OTHER] }
            accessLevel: { enum: [TRUSTED, LIMITED, VIEW_ONLY] }
        authorization:
          type: object
          additionalProperties: false
          required: [effectivePermissions]
          properties:
            effectivePermissions:
              type: array
              uniqueItems: true
              items:
                enum: [READ, WRITE, APPROVAL_REQUIRED, PUBLISH, SYSTEM]
        authentication:
          type: object
          required: [mode, message]
          properties:
            mode:
              const: LOCAL_DEMO
            message:
              type: string
    Workspace:
      type: object
      required: [id, name, timezone, locale, role]
      properties:
        id:
          type: string
        name:
          type: string
        timezone:
          type: string
        locale:
          type: string
        role:
          enum: [OWNER, EDITOR, VIEWER]
    Module:
      type: object
      required: [key, label, route, description]
      properties:
        key:
          enum: [HOME, IDA, MUSIC, CONTENT, SOCIAL, CALENDAR, CAMPAIGNS, ANALYTICS, TASKS, MEMORY, SYSTEM]
        label:
          type: string
        route:
          type: string
        description:
          type: string
    ModuleListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Module'
    AgentAllowedTool:
      type: object
      additionalProperties: false
      required: [key, moduleKey, permission]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 96
          pattern: '^[a-z][a-z0-9_]*$'
        moduleKey:
          enum: [HOME, IDA, MUSIC, CONTENT, SOCIAL, CALENDAR, CAMPAIGNS, ANALYTICS, TASKS, MEMORY, SYSTEM]
        permission:
          enum: [READ, WRITE, APPROVAL_REQUIRED, PUBLISH, SYSTEM]
    AgentManifest:
      type: object
      additionalProperties: false
      required:
        - key
        - version
        - status
        - displayName
        - domain
        - executionMode
        - supportedIntents
        - inputContract
        - outputContract
        - allowedTools
        - contextSources
        - approvalPolicy
        - promptVersion
        - evaluationSuite
      properties:
        key:
          type: string
          minLength: 8
          maxLength: 80
          pattern: '^agent_[A-Za-z0-9_]+$'
        version:
          type: string
          pattern: '^\\d+\\.\\d+\\.\\d+$'
        status:
          enum: [PLANNED, EXPERIMENTAL, ACTIVE, DISABLED]
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        domain:
          enum: [HOME, IDA, MUSIC, CONTENT, SOCIAL, CALENDAR, CAMPAIGNS, ANALYTICS, TASKS, MEMORY, SYSTEM]
        executionMode:
          enum: [READ_ONLY, PROPOSAL_ONLY, CONTROLLED_EXECUTION]
        supportedIntents:
          type: array
          minItems: 1
          maxItems: 12
          items:
            enum:
              - UNKNOWN
              - PREPARE_DAY
              - SEARCH_MEDIA
              - SEARCH_TRACK
              - LIST_UNUSED_CONTENT
              - CREATE_POST
              - UPDATE_POST
              - SCHEDULE_POST
              - ANALYZE_PERFORMANCE
              - CREATE_CAMPAIGN
              - GET_CALENDAR
              - CONNECT_SOCIAL_ACCOUNT
              - EXPLAIN_PROPOSAL
              - SAVE_MEMORY
        inputContract:
          type: string
          pattern: '^[a-z][a-z0-9._-]{0,79}$'
        outputContract:
          type: string
          pattern: '^[a-z][a-z0-9._-]{0,79}$'
        allowedTools:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/AgentAllowedTool'
        contextSources:
          type: array
          minItems: 1
          maxItems: 12
          items:
            enum:
              - ARTIST_PROFILE
              - MUSIC_CATALOG
              - CONTENT_LIBRARY
              - CAMPAIGN_CONTEXT
